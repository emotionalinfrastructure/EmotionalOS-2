name: EIS SDK CI

# GitHub Actions only discovers workflows in the repository-root
# .github/workflows directory, so the SDK's own packaged workflow
# (eis-sdk/.github/workflows/ci.yml) is NOT executed by this repo.
#
# For first-proof verification this workflow runs aggressively: it has no
# branch filter and no path filter, so it triggers on every push (any
# branch) and every pull request, plus a manual Run workflow button. Once
# it is green you can tighten it by re-adding:
#   paths:
#     - 'eis-sdk/**'
#     - '.github/workflows/eis-sdk-ci.yml'
on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: eis-sdk

jobs:
  verify:
    name: Verify eis-sdk
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: eis-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Pack (dry run)
        run: npm pack --dry-run
