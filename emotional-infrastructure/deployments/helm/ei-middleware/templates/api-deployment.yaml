apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-api
    {{- include "ei-middleware.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
        {{- include "ei-middleware.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: EI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ei-middleware.secretName" . }}
                  key: database-url
            - name: EI_LEDGER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ei-middleware.secretName" . }}
                  key: ledger-hmac-secret
            - name: EI_JWT_ISSUER
              value: {{ .Values.api.env.jwtIssuer | quote }}
            - name: EI_JWT_AUDIENCE
              value: {{ .Values.api.env.jwtAudience | quote }}
            - name: EI_TOKEN_TTL_SECONDS
              value: {{ .Values.api.env.tokenTtlSeconds | quote }}
            - name: EI_POLICY_URI_DEFAULT
              value: {{ .Values.api.env.policyUriDefault | quote }}
            - name: EI_CORS_ORIGINS
              value: {{ .Values.api.env.corsOrigins | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
