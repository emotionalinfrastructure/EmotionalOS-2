name: EIOS SDK Python CI

# Scoped to eios-sdk-python changes: runs on pushes and pull requests that
# touch eios-sdk-python/** or this workflow file, plus a manual trigger.
on:
  push:
    paths:
      - 'eios-sdk-python/**'
      - '.github/workflows/eios-sdk-python-ci.yml'
  pull_request:
    paths:
      - 'eios-sdk-python/**'
      - '.github/workflows/eios-sdk-python-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: eios-sdk-python

jobs:
  test:
    name: Test eios-sdk-python
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pynacl orjson

      - name: Run pytest with coverage gate
        run: pytest
        env:
          EIOS_HMAC_KEY: "ZmFrZV9rZXlfZmFrZV9rZXlfZmFrZV9rZXlfZmFrZV9rZXk="
