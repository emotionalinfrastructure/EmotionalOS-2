name: EIOS Gateway Python CI

on:
  push:
    paths:
      - 'eios-gateway-python/**'
      - '.github/workflows/eios-gateway-python-ci.yml'
  pull_request:
    paths:
      - 'eios-gateway-python/**'
      - '.github/workflows/eios-gateway-python-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: eios-gateway-python

jobs:
  test:
    name: Test eios-gateway-python
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e "../eios-sdk-python[dev]"
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run pytest with coverage gate
        run: pytest
        env:
          EIOS_HMAC_KEY: "ZmFrZV9rZXlfZmFrZV9rZXlfZmFrZV9rZXlfZmFrZV9rZXk="
